---
version: "0.1"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: ${matrix.os}

matrix:
  version: ["latest"]
  os: ["win", "mac"]
  browser: ["firefox", "chrome", "edge", "safari"]

exclusionMatrix: 
  - os: ["win"]
    browser: ["safari"]

autosplit: true
concurrency: 4
parallelism: 4

pre:
  - npm install
  - npx playwright install

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

testDiscovery:
  type: raw
  mode: dynamic
  winCommand: grep -lr 'describe' tests
  macCommand: grep -nri 'describe' tests  | sed 's/:test.*//'


testRunnerCommand: node hybridRunner.js ${matrix.browser} ${matrix.version} $test

retryOnFailure: true
maxRetries: 1

report: true
